[package]
name = "oharness"
version = "0.0.1-alpha"
description = "OHarness — Agent + Harness Design Studio"
authors = ["OHarness"]
edition = "2021"

[lib]
name = "oharness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
