name: Tarefa
description: Uma entrega de 1 PR. Mantenha curto.
labels: ["type:task", "status:backlog"]
body:
  - type: input
    id: goal
    attributes:
      label: Objetivo
      description: Uma frase.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Pronto quando
      description: Critérios verificáveis, em lista.
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Depende de
      description: Números de issues, se houver.
  - type: textarea
    id: ctx
    attributes:
      label: Contexto
      description: Links para ADR, arquivos ou PRs. Sem texto longo.
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready (docs/process/backlog.md)
      description: Só marque `status:ready` com todos marcados.
      options:
        - label: Critérios do "Pronto quando" são verificáveis e cabem em 1 PR pequeno
        - label: Dependências resolvidas e rótulos (type, area, prio, size) completos
        - label: Risco declarado (segurança, via de assinatura, UI)
        - label: Contexto mínimo linkado (ADR, arquivos ou PRs) e sem pergunta aberta ao dono
