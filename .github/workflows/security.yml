name: Security scan

on:
  workflow_call:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Queue runs have a unique gh-readonly-queue ref; never cancel them mid-flight.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  dependency-review:
    name: Dependency review
    # PR-only: the action and the compare API need PR base/head SHAs. In merge_group
    # this job is skipped; the PR already passed it and the aggregate below enforces that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Dependency graph (repo setting)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Avoid `gh | awk; exit` SIGPIPE (141) under pipefail when awk closes early.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/dependency-graph/compare/${BASE}...${HEAD}")
          if [[ "${code}" != "200" ]]; then
            echo "Dependency Review API returned HTTP ${code}." >&2
            echo "Enable Dependency graph under Settings → Advanced Security for this public repo." >&2
            echo "See https://github.com/${GH_REPO}/settings/security_analysis" >&2
            exit 1
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  dependency-review-issue:
    name: Track Dependency review
    needs: dependency-review
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][dependency-review] PR dependency review failed" \
            "dependency-review/high-or-denied-license" \
            "Dependency review failed (high severity and/or denied licenses). Enable Dependency graph + GitHub Advanced Security if the action cannot run. Run: ${RUN_URL}"

  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  opengrep:
    name: OpenGrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin rules by commit — never `--config auto` (mutable registry).
      - name: Checkout OpenGrep rules (immutable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false
      - name: Install verified OpenGrep 1.22.0
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/opengrep/opengrep/releases/download/v1.22.0/opengrep_manylinux_x86 \
            --output "${RUNNER_TEMP}/opengrep"
          echo "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319  ${RUNNER_TEMP}/opengrep" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/opengrep"
          "${RUNNER_TEMP}/opengrep" --version
      - name: Scan
        run: |
          "${RUNNER_TEMP}/opengrep" scan --error --sarif --output opengrep.sarif \
            --config .opengrep-rules/python/lang/security \
            --config .opengrep-rules/javascript/lang/security \
            --config .opengrep-rules/javascript/audit \
            --config .opengrep-rules/dockerfile/security \
            --config .opengrep-rules/html/security \
            --config .opengrep-rules/yaml/github-actions/security \
            --exclude .opengrep-rules \
            --exclude 'website/**/*.html' \
            --exclude .next --exclude node_modules --exclude target --exclude backend/build .
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('opengrep.sarif') != ''
        with:
          sarif_file: opengrep.sarif
          category: opengrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: opengrep-results
          path: opengrep.sarif
          if-no-files-found: error
          retention-days: 14

  opengrep-issue:
    name: Track OpenGrep
    needs: opengrep
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][opengrep] OpenGrep SAST findings" \
            "opengrep/sast-findings" \
            "OpenGrep failed with findings (also uploaded as SARIF to Code Scanning when available). Triage and fix or document exceptions. Run: ${RUN_URL}"

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          # SARIF mode otherwise includes all severities and still fails exit-code on MEDIUM/LOW.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  trivy-issue:
    name: Track Trivy
    needs: trivy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][trivy] HIGH/CRITICAL filesystem findings" \
            "trivy/fs-high-critical" \
            "Trivy filesystem scan failed on HIGH/CRITICAL (vuln/secret/misconfig). SARIF also goes to Code Scanning. Run: ${RUN_URL}"

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action rejects the merge_group event, so the queue runs the pinned CLI instead.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Gitleaks CLI (merge queue)
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz             --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  secrets-issue:
    name: Track Gitleaks
    needs: secrets
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][gitleaks] Secret detection findings" \
            "gitleaks/secret-findings" \
            "Gitleaks reported leaked secrets or failed the scan. Rotate any real credentials immediately; do not paste secret values into the issue. Run: ${RUN_URL}"

  workflow-security:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/

  workflow-security-issue:
    name: Track Zizmor
    needs: workflow-security
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/upsert-security-issue.sh \
            "[security][zizmor] Workflow security findings" \
            "zizmor/workflow-audit" \
            "Zizmor Actions audit failed. Harden the flagged workflows. Run: ${RUN_URL}"

  required:
    name: Security scan / required
    if: always()
    needs: [dependency-review, codeql, opengrep, trivy, secrets, workflow-security]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
