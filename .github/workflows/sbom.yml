name: SBOM CycloneDX

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            website/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: $/.github/actions/setup-safe-chain # nosemgrep: third-party-action-not-pinned-to-commit-sha (in-repo action, self-repository syntax)
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix frontend
          npm ci --ignore-scripts --prefix website
          python -m pip install -r backend/requirements.txt
      - name: Install pinned CycloneDX generators
        run: |
          npm install --global @cyclonedx/cyclonedx-npm@6.0.1
          python -m pip install cyclonedx-bom==7.4.0
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate component SBOMs
        run: |
          mkdir -p sbom
          cyclonedx-npm --output-file sbom/root-npm.cdx.json --output-format JSON package-lock.json
          cyclonedx-npm --output-file sbom/frontend.cdx.json --output-format JSON frontend/package-lock.json
          cyclonedx-npm --output-file sbom/website.cdx.json --output-format JSON website/package-lock.json
          cyclonedx-py requirements backend/requirements.txt --output-format JSON --output-file sbom/backend.cdx.json
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --override-filename tauri
          # --override-filename drops the ".cdx" infix (cargo-cyclonedx writes tauri.json, not tauri.cdx.json).
          mv src-tauri/tauri.json sbom/tauri.cdx.json
      - name: Validate CycloneDX JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("sbom").glob("*.cdx.json"))
          assert len(files) == 5, files
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion"), path
              assert isinstance(data.get("components", []), list), path
              print(path, len(data.get("components", [])))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sboms-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
