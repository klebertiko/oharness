name: Laya triage

on:
  issues:
    types: [opened, edited]
  # Smoke path so the workflow can be proven before it lands on the default branch.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to classify (advisory only)
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: laya-shadow-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    name: Advisory classification only
    # Advisory = not a required merge gate. Failures must still surface as red —
    # never continue-on-error (that painted workflow_dispatch failures green).
    if: vars.ENABLE_LAYA_SHADOW == 'true' && (github.event_name == 'issues' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_XET: "1"
      USE_TF: "0"
      LAYA_OUTPUT: laya-shadow-result.json
      LAYA_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Issues events must load the workflow from the default branch; dispatch may run any ref.
          ref: ${{ github.event_name == 'issues' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: $/.github/actions/setup-safe-chain # nosemgrep: third-party-action-not-pinned-to-commit-sha (in-repo action, self-repository syntax)
      - run: python -m pip install laya==0.3.5
      - name: Produce non-authoritative evidence
        run: python scripts/laya_issue_shadow.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laya-shadow-issue-${{ env.LAYA_ISSUE_NUMBER }}
          path: laya-shadow-result.json
          if-no-files-found: error
          retention-days: 30
