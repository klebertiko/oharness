version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Drive-by majors that break the monorepo in one PR — bump deliberately.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      root-npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Majors below break the build (Tailwind 4 needs @tailwindcss/postcss,
      # @types/node must track the Node 22 runtime) — migrate deliberately.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Vite 8 swaps esbuild for rolldown/oxc; vitest.config.ts uses esbuild.jsx.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
    groups:
      frontend-npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      website-npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      backend-python:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      tauri-rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      github-actions:
        patterns: ["*"]
