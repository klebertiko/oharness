<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../theme.js"></script><style>
html,body{margin:0;background:var(--sub-000)}
svg{display:block;width:960px;height:288px}
.slab{fill:var(--signal);rx:var(--radius-panel)}
.amber{fill:var(--warn);rx:var(--radius-panel)}
.step{fill:var(--sub-300);rx:var(--radius-panel)}
.ink{fill:var(--ink-primary);rx:var(--radius-panel)}
.skill{fill:var(--role-skill);rx:var(--radius-panel)}
.dot{fill:var(--sub-400)}
.name{font:500 64px/1 var(--font-ui);letter-spacing:-0.018em;fill:var(--ink-primary)}
.tag{font:400 13px/1.4 var(--font-ui);fill:var(--ink-mute)}
</style></head><body>
<svg viewBox="0 0 960 288" role="img" aria-label="OHarness">
<!-- blocks: signal 224x176, warn 96x128, sub-300 112x112 bleeding right, ink 112x96 bleeding down, role-skill 96x96 (steps of space-4=16px).
     arrangement: one tall signal slab with satellites stepping right and off the top and bottom edges, like nodes in a graph.
     pattern: dot grid at space-4 pitch - precise, technical, 4px-grid, mono instrument (README: machine data, 4px grid).
     radius-panel on every block; dots are 2px discs on a 16px pitch, 12 by 6. -->
<rect class="slab" x="496" y="-8" width="224" height="184"/>
<rect class="amber" x="736" y="48" width="96" height="128"/>
<rect class="step" x="848" y="-8" width="120" height="120"/>
<rect class="ink" x="496" y="192" width="112" height="104"/>
<rect class="skill" x="624" y="192" width="96" height="104"/>
<g id="dots"></g>
<text class="name" x="48" y="232">OHarness</text>
<text class="tag" x="48" y="262">An agent workspace with a portable harness.</text>
</svg>
<script>
var g=document.getElementById('dots'),ns='http://www.w3.org/2000/svg';
for(var r=0;r<6;r++)for(var c=0;c<12;c++){var x=744+c*16,y=200+r*16;if(x<960){var d=document.createElementNS(ns,'circle');d.setAttribute('class','dot');d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',2);g.appendChild(d);}}
</script>
</body></html>
